<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#f2ead8">
  <title>Callen's Canvas Escape</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f2ead8;
      --ink: #263b32;
      --muted: #64746a;
      --rust: #c45c3c;
      --frame: #69412d;
      --leaf: #68846b;
      --sun: #f0c75e;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 28px clamp(16px, 4vw, 56px) 24px;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(#8e795b20 0.7px, transparent 0.7px);
      background-size: 8px 8px;
      font-family: Georgia, "Times New Roman", serif;
    }

    button { font: inherit; }

    .page { width: min(1050px, 100%); margin: 0 auto; }

    .page:fullscreen {
      width: 100%;
      max-width: none;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: var(--paper);
    }

    .page.is-fullscreen {
      position: fixed;
      z-index: 20;
      inset: 0;
      width: 100%;
      max-width: none;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      background: var(--paper);
    }

    .page:fullscreen .frame, .page.is-fullscreen .frame {
      display: block;
      flex: 0 1 auto;
      align-self: center;
      width: fit-content;
      max-width: 100%;
      min-height: 0;
      margin: auto;
    }

    .page:fullscreen canvas, .page.is-fullscreen canvas {
      width: auto;
      max-width: 100%;
      height: auto;
      max-height: calc(100vh - 220px);
      max-height: calc(100dvh - 220px);
    }

    .masthead {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 16px;
    }

    .eyebrow, .label, .help, .brush-count, .message, .mobile-controls button {
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--rust);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    h1 { margin: 0; font-size: clamp(27px, 4vw, 42px); font-weight: 500; line-height: 1; }

    .brush-count {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0 3px;
      font-size: 14px;
      white-space: nowrap;
    }

    .brush-icons { color: #b6a88b; font-size: 20px; letter-spacing: 2px; }
    .brush-icons span.collected { color: #d69932; }

    .frame {
      position: relative;
      padding: clamp(10px, 1.6vw, 17px);
      border: 1px solid #4d3025;
      border-radius: 3px;
      background-color: var(--frame);
      background-image: repeating-linear-gradient(3deg, transparent 0 7px, #d69a5222 8px, transparent 10px 17px), linear-gradient(110deg, #815237, #553626 45%, #754a30);
      box-shadow: 0 14px 30px #49332038, inset 0 0 0 3px #b07a4a, inset 0 0 0 5px #422b21;
    }

    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 900 / 560;
      border: 2px solid #302c25;
      background: #d7d4a0;
      touch-action: none;
    }

    .ending-overlay {
      position: absolute;
      z-index: 4;
      inset: clamp(11px, 1.8vw, 18px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 28px 16px 38px;
      color: #fff5d5;
      text-align: center;
      pointer-events: none;
    }

    .ending-overlay[hidden], .mobile-controls[hidden] { display: none; }

    .ending-overlay h2 {
      margin: 0;
      font-size: 36px;
      font-weight: 500;
      line-height: 1.1;
      text-shadow: 0 2px 6px #17231dcc;
    }

    .ending-overlay button {
      padding: 12px 24px;
      border: 2px solid #fff5d5;
      border-radius: 3px;
      color: #263b32;
      background: #f0c75e;
      box-shadow: 0 3px 10px #17231d88;
      cursor: pointer;
      font: bold 16px "Trebuchet MS", Arial, sans-serif;
      pointer-events: auto;
    }

    .ending-overlay button:hover { background: #ffda72; }
    .ending-overlay button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

    .underbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 13px 2px 0;
    }

    .actions { display: flex; flex: 0 0 auto; gap: 8px; }

    .message { min-height: 20px; color: var(--ink); font-size: 13px; }
    .help { color: var(--muted); font-size: 12px; text-align: right; }
    kbd {
      display: inline-block;
      min-width: 1.5em;
      margin: 0 1px;
      padding: 1px 4px;
      border: 1px solid #a7987a;
      border-radius: 3px;
      color: var(--ink);
      background: #fffaf0;
      font: 11px "Trebuchet MS", Arial, sans-serif;
      text-align: center;
    }

    .reset {
      display: inline-grid;
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid #a7987a;
      border-radius: 50%;
      color: var(--ink);
      background: #fffaf0;
      cursor: pointer;
      font-family: Arial, sans-serif;
      font-size: 20px;
      transition: transform 160ms ease, background 160ms ease;
    }

    .reset:hover { transform: rotate(-35deg); background: white; }
    .reset:focus-visible, .mobile-controls button:focus-visible { outline: 3px solid #c45c3c; outline-offset: 3px; }
    #fullscreen { font-size: 22px; }
    #fullscreen:hover { transform: none; }

    .mobile-controls {
      position: absolute;
      z-index: 3;
      left: clamp(24px, 3vw, 40px);
      bottom: clamp(24px, 3vw, 40px);
      display: grid;
      grid-template: repeat(2, 50px) / repeat(3, 50px);
      justify-content: center;
      gap: 4px;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    .mobile-controls button {
      border: 2px solid #ffffff99;
      border-radius: 5px;
      color: #fff;
      background: #1d292f66;
      box-shadow: 0 2px 5px #10181d55;
      font-size: 25px;
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 1px 3px #10181dcc;
      touch-action: none;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .mobile-controls button:active { background: #1d292f99; }

    .mobile-controls [data-dir="up"] { grid-area: 1 / 2; }
    .mobile-controls [data-dir="left"] { grid-area: 2 / 1; }
    .mobile-controls [data-dir="down"] { grid-area: 2 / 2; }
    .mobile-controls [data-dir="right"] { grid-area: 2 / 3; }

    .version {
      position: fixed;
      z-index: 4;
      right: max(16px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom));
      padding: 5px 8px;
      border: 1px solid #a7987a;
      border-radius: 3px;
      color: var(--muted);
      background: #f2ead8e8;
      font: 11px "Trebuchet MS", Arial, sans-serif;
    }

    @media (max-width: 620px) {
      body { padding-top: 20px; }
      .masthead { align-items: start; }
      .brush-count { gap: 6px; font-size: 12px; }
      .brush-icons { font-size: 17px; }
      .underbar { align-items: start; }
      .help { max-width: 190px; line-height: 1.5; }
      .ending-overlay { padding: 20px 10px 24px; }
      .ending-overlay h2 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead">
      <div>
        <p class="eyebrow" id="levelLabel">Level 1 · A tiny adventure under the bed</p>
        <h1>Callen's Canvas Escape</h1>
      </div>
      <div class="brush-count" aria-live="polite">
        <span class="label">Brushes</span>
        <span class="brush-icons" id="brushIcons" aria-label="0 of 3 collected">○ ○ ○</span>
        <span id="brushTotal">0 / 3</span>
      </div>
    </header>

    <section class="frame" aria-label="Game canvas framed in wood">
      <canvas id="game" width="900" height="560" aria-label="Level 1: collect three paintbrushes and reach the portal.">Your browser does not support the game canvas.</canvas>
      <div class="ending-overlay" id="endingOverlay" hidden aria-labelledby="endingTitle">
        <h2 id="endingTitle">Congratulations, you won!</h2>
        <button id="playAgain" type="button">Play Again?</button>
      </div>
      <div class="mobile-controls" aria-label="Touch movement controls">
        <button type="button" data-dir="up" aria-label="Move up">↑</button>
        <button type="button" data-dir="left" aria-label="Move left">←</button>
        <button type="button" data-dir="down" aria-label="Move down">↓</button>
        <button type="button" data-dir="right" aria-label="Move right">→</button>
      </div>
    </section>

    <footer>
    <div class="underbar">
      <div class="message" id="message" aria-live="polite">Find the three paintbrushes. Watch out for the dust bunnies!</div>
      <div class="help" id="help">Move with <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Avoid bunnies · Paint slows you down</div>
      <div class="actions">
        <button class="reset" id="fullscreen" type="button" aria-label="Enter fullscreen" title="Enter fullscreen">⛶</button>
        <button class="reset" id="reset" type="button" aria-label="Restart game" title="Restart game">↻</button>
      </div>
    </div>

    <div class="version" aria-label="Version 1.0.5">v1.0.5</div>
    </footer>
  </main>

  <script>
    const canvas = document.querySelector("#game");
    const ctx = canvas.getContext("2d");
    const brushIcons = document.querySelector("#brushIcons");
    const brushTotal = document.querySelector("#brushTotal");
    const message = document.querySelector("#message");
    const fullscreenButton = document.querySelector("#fullscreen");
    const page = document.querySelector(".page");
    const levelLabel = document.querySelector("#levelLabel");
    const help = document.querySelector("#help");
    const gameCanvas = document.querySelector("#game");
    const endingOverlay = document.querySelector("#endingOverlay");
    const mobileControls = document.querySelector(".mobile-controls");
    const width = 900;
    const height = 560;
    const keys = new Set();
    const start = { x: 82, y: 278 };
    const brushSpots = [{ x: 225, y: 105 }, { x: 462, y: 438 }, { x: 728, y: 164 }];
    const paints = [
      { x: 330, y: 205, rx: 66, ry: 35, color: "#d87563" },
      { x: 585, y: 360, rx: 78, ry: 30, color: "#7d88a9" },
      { x: 745, y: 465, rx: 55, ry: 26, color: "#d9b746" }
    ];
    const bricks = [{ x: 167, y: 426 }, { x: 514, y: 122 }, { x: 800, y: 278 }];
    let player;
    let daddy;
    let hunters;
    let brushes;
    let bunnies;
    let level;
    let won;
    let sliding;
    let slideProgress;
    let carX;
    let inCar;
    let police;
    let attendants;
    let arriving;
    let arrivalProgress;
    let climbing;
    let climbProgress;
    let fireworks;
    let graceUntil;
    let waiting = false;
    let lastTime = 0;
    let elapsed = 0;

    function reset() {
      waiting = true;
      keys.clear();
      endingOverlay.hidden = true;
      mobileControls.hidden = false;
      level = 1;
      player = { ...start };
      daddy = null;
      hunters = [];
      brushes = [false, false, false];
      bunnies = [
        { x: 365, y: 340, vx: 105, vy: 74, phase: 0 },
        { x: 641, y: 224, vx: -83, vy: 112, phase: 1.7 },
        { x: 790, y: 112, vx: 95, vy: -72, phase: 3.1 }
      ];
      won = false;
      sliding = false;
      slideProgress = 0;
      carX = 0;
      inCar = false;
      police = [];
      attendants = [];
      arriving = false;
      arrivalProgress = 0;
      climbing = false;
      climbProgress = 0;
      fireworks = [];
      graceUntil = elapsed + 1.5;
      levelLabel.textContent = "Level 1 · A tiny adventure under the bed";
      help.innerHTML = "Move with <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Avoid bunnies · Paint slows you down";
      gameCanvas.setAttribute("aria-label", "Level 1: collect three paintbrushes and reach the portal.");
      updateHud("Find the three paintbrushes. Watch out for the dust bunnies!");
    }

    function startRoomLevel() {
      waiting = true;
      keys.clear();
      level = 2;
      player = { x: 140, y: 385 };
      daddy = { x: 45, y: 385 };
      graceUntil = elapsed + 1.2;
      levelLabel.textContent = "Level 2 · The room beyond the frame";
      help.innerHTML = "Crawl with <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Reach the open door before Daddy catches up";
      gameCanvas.setAttribute("aria-label", "Level 2: crawl Baby Callen to the open doorway while Daddy chases.");
      updateHud("Daddy is right behind you! Crawl to the open door!");
    }

    function resetRoofLevel(text) {
      waiting = true;
      keys.clear();
      player = { x: 170, y: 245 };
      hunters = [
        { name: "Hunter", x: 34, y: 190, shirt: "#527fa5", hair: "#6b503d", speed: 165 },
        { name: "Freya", x: 42, y: 305, shirt: "#bd6f83", hair: "#8d503c", speed: 170 }
      ];
      sliding = false;
      slideProgress = 0;
      graceUntil = elapsed + 1.1;
      updateHud(text);
    }

    function startRoofLevel() {
      waiting = true;
      keys.clear();
      level = 3;
      levelLabel.textContent = "Level 3 · The rooftop run";
      help.innerHTML = "Move with <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Reach the slide to land in the front garden";
      gameCanvas.setAttribute("aria-label", "Level 3: escape Hunter and Freya on the rooftop and slide into the front garden.");
      resetRoofLevel("Hunter and Freya are after you! Get to the slide!");
    }

    function resetGardenLevel(text) {
      waiting = true;
      keys.clear();
      player = { x: 145, y: 430 };
      hunters = [
        { name: "Leo", x: 28, y: 365, shirt: "#d18b4c", hair: "#654839", speed: 158 },
        { name: "Hunter", x: 38, y: 430, shirt: "#527fa5", hair: "#6b503d", speed: 165 },
        { name: "Freya", x: 28, y: 495, shirt: "#bd6f83", hair: "#8d503c", speed: 170 }
      ];
      carX = 770;
      inCar = false;
      graceUntil = elapsed + 1.2;
      updateHud(text);
    }

    function startGardenLevel() {
      waiting = true;
      keys.clear();
      level = 4;
      levelLabel.textContent = "Level 4 · The front garden";
      help.innerHTML = "Move with <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Reach the car before Leo, Hunter, and Freya catch up";
      gameCanvas.setAttribute("aria-label", "Level 4: reach the car in the front garden while Leo, Hunter, and Freya chase.");
      resetGardenLevel("Leo, Hunter, and Freya are right behind you! Get to the car!");
    }

    function resetPoliceLevel(text) {
      waiting = true;
      keys.clear();
      player = { x: 130, y: 430 };
      police = [
        { x: 28, y: 345, speed: 142, phase: 0 },
        { x: 42, y: 500, speed: 148, phase: 1.4 }
      ];
      inCar = true;
      graceUntil = elapsed + 1.2;
      updateHud(text);
    }

    function startPoliceLevel() {
      waiting = true;
      keys.clear();
      level = 5;
      levelLabel.textContent = "Level 5 · The airport dash";
      help.innerHTML = "Steer with <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> · Reach the Australia airport";
      gameCanvas.setAttribute("aria-label", "Level 5: drive to the airport while police cars follow.");
      resetPoliceLevel("The police are following! Drive to the airport!");
    }

    function resetFlightLevel(text) {
      waiting = true;
      keys.clear();
      player = { x: 450, y: 485 };
      attendants = [
        { name: "Crew 1", x: 370, y: 520, shirt: "#416c78", hair: "#504139", speed: 138 },
        { name: "Crew 2", x: 530, y: 520, shirt: "#4e7780", hair: "#76503e", speed: 144 }
      ];
      arriving = false;
      arrivalProgress = 0;
      inCar = false;
      graceUntil = elapsed + 1.3;
      updateHud(text);
    }

    function startFlightLevel() {
      waiting = true;
      keys.clear();
      level = 6;
      levelLabel.textContent = "Level 6 · Australia to New York";
      help.textContent = "Crawl to the front of the plane while the flight attendants follow";
      gameCanvas.setAttribute("aria-label", "Level 6: crawl through the airplane cabin to arrive in New York.");
      resetFlightLevel("The flight attendants spotted Callen! Head toward New York!");
    }

    function resetParkLevel(text) {
      waiting = true;
      keys.clear();
      player = { x: 105, y: 455 };
      hunters = [{ name: "President Donald Trump", x: 100, y: 350, shirt: "#263f67", hair: "#d8b655", speed: 155 }];
      graceUntil = elapsed + 1.4;
      updateHud(text);
    }

    function startParkLevel() {
      waiting = true;
      keys.clear();
      level = 7;
      levelLabel.textContent = "Level 7 · The park run";
      help.textContent = "Run through the park to the statue while President Donald Trump chases";
      gameCanvas.setAttribute("aria-label", "Level 7: run through Battery Park to the Statue of Liberty while President Donald Trump chases.");
      resetParkLevel("Welcome to New York! President Donald Trump is chasing Callen through the park!");
    }

    function startClimbLevel() {
      waiting = true;
      keys.clear();
      level = 8;
      player = { x: 680, y: 435 };
      hunters = [];
      climbing = true;
      climbProgress = 0;
      levelLabel.textContent = "Level 8 · Climb the statue";
      help.innerHTML = "Hold <kbd>↑</kbd> or <kbd>W</kbd> to climb toward Barack Obama and the crown";
      gameCanvas.setAttribute("aria-label", "Level 8: climb the Statue of Liberty to meet Barack Obama at the top.");
      updateHud("Barack Obama is waiting at the top!");
      message.innerHTML = "Barack Obama is waiting at the top! Hold <kbd>↑</kbd> or <kbd>W</kbd> to climb!";
    }

    function startHarborView() {
      level = 9;
      won = false;
      endingOverlay.hidden = false;
      mobileControls.hidden = true;
      fireworks = [
        { x: 180, y: 125, phase: 0.08, color: "#f2cd62" },
        { x: 465, y: 95, phase: 0.42, color: "#f17e73" },
        { x: 730, y: 145, phase: 0.73, color: "#94d4ca" }
      ];
      levelLabel.textContent = "New York Harbor";
      help.textContent = "A view of the harbor beneath the fireworks";
      gameCanvas.setAttribute("aria-label", "Fireworks over New York Harbor from the Statue of Liberty.");
      keys.clear();
      updateHud("Callen reached the top! Fireworks light up New York Harbor!");
    }

    function updateHud(text) {
      const count = brushes.filter(Boolean).length;
      brushIcons.innerHTML = brushes.map((collected) => `<span class="${collected ? "collected" : ""}">${collected ? "✦" : "○"}</span>`).join(" ");
      brushIcons.setAttribute("aria-label", `${count} of 3 collected`);
      brushTotal.textContent = `${count} / 3`;
      message.textContent = text;
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(bounds.width * dpr);
      canvas.height = Math.round(bounds.height * dpr);
      ctx.setTransform(canvas.width / width, 0, 0, canvas.height / height, 0, 0);
      draw();
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }

    function drawBackground() {
      ctx.fillStyle = "#d8d69e";
      ctx.fillRect(0, 0, width, height);
      ctx.fillStyle = "#50664f";
      ctx.fillRect(0, 0, width, 15);
      ctx.fillRect(0, height - 15, width, 15);
      ctx.fillRect(0, 0, 15, height);
      ctx.fillRect(width - 15, 0, 15, height);

      for (let y = 31; y < height - 20; y += 28) {
        for (let x = 30 + ((y / 28) % 2) * 13; x < width - 20; x += 32) {
          ctx.fillStyle = "#6e784d18";
          ctx.beginPath();
          ctx.arc(x, y, 1.2, 0, Math.PI * 2);
          ctx.fill();
        }
      }
          ctx.fillRect(100, 342, 800, 218);
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.strokeStyle = "#fff8d5";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(90, 50); ctx.bezierCurveTo(240, 14, 310, 78, 440, 48);
      ctx.moveTo(100, 510); ctx.bezierCurveTo(280, 475, 390, 540, 545, 500);
      ctx.stroke();
      ctx.restore();

      paints.forEach((paint) => {
        ctx.fillStyle = paint.color;
        ctx.globalAlpha = 0.72;
        ctx.beginPath();
        ctx.ellipse(paint.x, paint.y, paint.rx, paint.ry, -0.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.fillStyle = "#fff4d080";
        ctx.beginPath();
        ctx.ellipse(paint.x - 12, paint.y - 6, paint.rx * 0.54, paint.ry * 0.28, -0.2, 0, Math.PI * 2);
        ctx.fill();
        [[-0.8, 0.6], [0.8, -0.6], [0.4, 0.9]].forEach(([dx, dy]) => {
          ctx.beginPath();
          ctx.arc(paint.x + dx * paint.rx, paint.y + dy * paint.ry, 5, 0, Math.PI * 2);
          ctx.fill();
        });
      });

      bricks.forEach((brick, i) => {
        ctx.save();
        ctx.translate(brick.x, brick.y);

        drawRoadBackground();
        police.forEach(drawPoliceCar);
        drawCar(player.x, player.y, true);
      } else if (level === 6) {
        drawFlightBackground();
        attendants.forEach(drawHunter);
        drawPlayer();
      } else if (level === 7) {
        drawParkBackground();
        drawStatue();
        hunters.forEach(drawHunter);
        drawPlayer();
      } else if (level === 8) {
        drawParkBackground();
        drawStatue();
        drawObama();

    function updateRoom(delta) {
      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(34, Math.min(width - 34, player.x + directionX / magnitude * 180 * delta));
      player.y = Math.max(35, Math.min(height - 35, player.y + directionY / magnitude * 180 * delta));

      const chaseX = player.x - daddy.x;
      const chaseY = player.y - daddy.y;
      const distance = Math.hypot(chaseX, chaseY) || 1;
      daddy.x += chaseX / distance * 155 * delta;
      daddy.y += chaseY / distance * 155 * delta;

      if (elapsed >= graceUntil && Math.hypot(player.x - daddy.x, player.y - daddy.y) < 32) {
        player = { x: 140, y: 385 };
        daddy = { x: 45, y: 385 };
        graceUntil = elapsed + 1.2;
        updateHud("Daddy caught up! Crawl for the door again!");
        return;
      }

      if (player.x > 835 && player.y > 248 && player.y < 430) {
        startRoofLevel();
      }
    }

    function updateRoofLevel(delta) {
      if (sliding) {
        slideProgress = Math.min(1, slideProgress + delta / 1.8);
        const inverse = 1 - slideProgress;
        player.x = inverse * inverse * 690 + 2 * inverse * slideProgress * 770 + slideProgress * slideProgress * 805;
        player.y = inverse * inverse * 310 + 2 * inverse * slideProgress * 350 + slideProgress * slideProgress * 492;
        if (slideProgress === 1) startGardenLevel();
        return;
      }

      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(34, Math.min(700, player.x + directionX / magnitude * 185 * delta));
      player.y = Math.max(110, Math.min(317, player.y + directionY / magnitude * 185 * delta));

      hunters.forEach((hunter) => {
        const chaseX = player.x - hunter.x;
        const chaseY = player.y - hunter.y;
        const distance = Math.hypot(chaseX, chaseY) || 1;
        hunter.x += chaseX / distance * hunter.speed * delta;
        hunter.y += chaseY / distance * hunter.speed * delta;
      });

      if (elapsed >= graceUntil && hunters.some((hunter) => Math.hypot(player.x - hunter.x, player.y - hunter.y) < 34)) {
        resetRoofLevel("Hunter or Freya caught up! Try the rooftop again!");
        return;
      }

      if (player.x > 660 && player.y > 270) {
        sliding = true;
        slideProgress = 0;
        keys.clear();
        updateHud("Callen found the slide! Hold on!");
      }
    }

    function updateGardenLevel(delta) {
      if (inCar) {
        carX += 270 * delta;
        player.x = carX;
        hunters.forEach((hunter) => {
          const chaseX = carX - hunter.x;
          const chaseY = 435 - hunter.y;
          const distance = Math.hypot(chaseX, chaseY) || 1;
          hunter.x += chaseX / distance * hunter.speed * delta;
          hunter.y += chaseY / distance * hunter.speed * delta;
        });
        if (carX > width + 100) {
          startPoliceLevel();
        }
        return;
      }

      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(34, Math.min(865, player.x + directionX / magnitude * 185 * delta));
      player.y = Math.max(270, Math.min(525, player.y + directionY / magnitude * 185 * delta));

      hunters.forEach((hunter) => {
        const chaseX = player.x - hunter.x;
        const chaseY = player.y - hunter.y;
        const distance = Math.hypot(chaseX, chaseY) || 1;
        hunter.x += chaseX / distance * hunter.speed * delta;
        hunter.y += chaseY / distance * hunter.speed * delta;
      });

      if (elapsed >= graceUntil && hunters.some((hunter) => Math.hypot(player.x - hunter.x, player.y - hunter.y) < 34)) {
        resetGardenLevel("Leo, Hunter, and Freya caught up! Try for the car again!");
        return;
      }

      if (Math.hypot(player.x - carX, player.y - 435) < 52) {
        inCar = true;
        keys.clear();
        updateHud("Callen grabbed his root beer! Time for a getaway!");
      }
    }

    function updatePoliceLevel(delta) {
      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(45, Math.min(865, player.x + directionX / magnitude * 200 * delta));
      player.y = Math.max(300, Math.min(520, player.y + directionY / magnitude * 200 * delta));

      police.forEach((car) => {
        const chaseX = player.x - car.x;
        const chaseY = player.y - car.y;
        const distance = Math.hypot(chaseX, chaseY) || 1;
        car.x += chaseX / distance * car.speed * delta;
        car.y += chaseY / distance * car.speed * delta;
      });

      if (elapsed >= graceUntil && police.some((car) => Math.hypot(player.x - car.x, player.y - car.y) < 48)) {
        resetPoliceLevel("The police caught up! Take another run at the airport!");
        return;
      }

      if (player.x > 790 && player.y > 320 && player.y < 515) startFlightLevel();
    }

    function updateFlightLevel(delta) {
      if (arriving) {
        arrivalProgress += delta;
        if (arrivalProgress >= 2.4) startParkLevel();
        return;
      }

      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(65, Math.min(835, player.x + directionX / magnitude * 175 * delta));
      player.y = Math.max(65, Math.min(510, player.y + directionY / magnitude * 175 * delta));

      attendants.forEach((attendant) => {
        const chaseX = player.x - attendant.x;
        const chaseY = player.y - attendant.y;
        const distance = Math.hypot(chaseX, chaseY) || 1;
        attendant.x += chaseX / distance * attendant.speed * delta;
        attendant.y += chaseY / distance * attendant.speed * delta;
      });

      if (elapsed >= graceUntil && attendants.some((attendant) => Math.hypot(player.x - attendant.x, player.y - attendant.y) < 34)) {
        resetFlightLevel("The attendants caught up! Try the cabin dash again!");
        return;
      }

      if (player.y < 105 && player.x > 385 && player.x < 515) {
        arriving = true;
        arrivalProgress = 0;
        keys.clear();
        updateHud("New York is in sight! The plane is landing!");
      }
    }

    function updateParkLevel(delta) {
      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(34, Math.min(700, player.x + directionX / magnitude * 190 * delta));
      player.y = Math.max(265, Math.min(525, player.y + directionY / magnitude * 190 * delta));

      hunters.forEach((hunter) => {
        const chaseX = player.x - hunter.x;
        const chaseY = player.y - hunter.y;
        const distance = Math.hypot(chaseX, chaseY) || 1;
        hunter.x += chaseX / distance * hunter.speed * delta;
        hunter.y += chaseY / distance * hunter.speed * delta;
      });

      if (elapsed >= graceUntil && hunters.some((hunter) => Math.hypot(player.x - hunter.x, player.y - hunter.y) < 34)) {
        resetParkLevel("President Donald Trump caught up! Run to the statue again!");
        return;
      }

      if (player.x > 620 && player.y > 400) startClimbLevel();
    }

    function updateClimbLevel(delta) {
      if (keys.has("ArrowUp") || keys.has("w")) climbProgress = Math.min(1, climbProgress + delta * 0.42);
      player.x = 680 + climbProgress * 105;
      player.y = 435 - climbProgress * 285;
      if (climbProgress === 1) startHarborView();
    }

    function update(delta) {
      if (waiting) {
        if (keys.size === 0) return;
        waiting = false;
        graceUntil = elapsed + 1.5;
      }
      if (won) return;
      elapsed += delta;
      if (level === 3) {
        updateRoofLevel(delta);
        return;
      }
      if (level === 4) {
        updateGardenLevel(delta);
        return;
      }
      if (level === 5) {
        updatePoliceLevel(delta);
        return;
      }
      if (level === 6) {
        updateFlightLevel(delta);
        return;
      }
      if (level === 7) {
        updateParkLevel(delta);
        return;
      }
      if (level === 8) {
        updateClimbLevel(delta);
        return;
      }
      if (level === 9) return;
      if (level === 2) {
        updateRoom(delta);
        return;
      }
      const directionX = Number(keys.has("ArrowRight") || keys.has("d")) - Number(keys.has("ArrowLeft") || keys.has("a"));
      const directionY = Number(keys.has("ArrowDown") || keys.has("s")) - Number(keys.has("ArrowUp") || keys.has("w"));
      const inPaint = paints.some((paint) => ((player.x - paint.x) / (paint.rx + 8)) ** 2 + ((player.y - paint.y) / (paint.ry + 8)) ** 2 < 1);
      const speed = inPaint ? 105 : 190;
      const magnitude = Math.hypot(directionX, directionY) || 1;
      player.x = Math.max(34, Math.min(width - 34, player.x + directionX / magnitude * speed * delta));
      player.y = Math.max(35, Math.min(height - 35, player.y + directionY / magnitude * speed * delta));

      bunnies.forEach((bunny) => {
        bunny.x += bunny.vx * delta;
        bunny.y += bunny.vy * delta;
        if (bunny.x < 45 || bunny.x > width - 45) bunny.vx *= -1;
        if (bunny.y < 48 || bunny.y > height - 48) bunny.vy *= -1;
        if (elapsed >= graceUntil && Math.hypot(player.x - bunny.x, player.y - bunny.y) < 33) {
          reset();
          updateHud("A dust bunny caught Callen. Try the canvas again!");
          return;
        }
      });

      brushSpots.forEach((spot, index) => {
        if (!brushes[index] && Math.hypot(player.x - spot.x, player.y - spot.y) < 31) {
          brushes[index] = true;
          const count = brushes.filter(Boolean).length;
          updateHud(count === 3 ? "The portal is open! Make a dash for the frame." : `Paintbrush found. ${3 - count} more to go!`);
        }
      });

      if (brushes.every(Boolean) && player.x > 817 && Math.abs(player.y - 280) < 42) {
        startRoomLevel();
      }
    }

    function loop(time) {
      const delta = Math.min((time - lastTime) / 1000 || 0, 0.04);
      lastTime = time;
      update(delta);
      draw();
      requestAnimationFrame(loop);
    }

    const keyMap = { ArrowUp: "ArrowUp", ArrowDown: "ArrowDown", ArrowLeft: "ArrowLeft", ArrowRight: "ArrowRight", w: "w", a: "a", s: "s", d: "d" };
    window.addEventListener("keydown", (event) => {
      const key = keyMap[event.key] || keyMap[event.key.toLowerCase()];
      if (key) {
        event.preventDefault();
        if (!waiting || !event.repeat) keys.add(key);
      }
    });
    window.addEventListener("keyup", (event) => {
      const key = keyMap[event.key] || keyMap[event.key.toLowerCase()];
      if (key) keys.delete(key);
    });
    window.addEventListener("blur", () => keys.clear());
    document.querySelector("#reset").addEventListener("click", reset);
      document.querySelector("#playAgain").addEventListener("click", reset);
    document.querySelectorAll(".mobile-controls button").forEach((button) => {
      const direction = { up: "ArrowUp", down: "ArrowDown", left: "ArrowLeft", right: "ArrowRight" }[button.dataset.dir];
      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        keys.add(direction);
        button.setPointerCapture(event.pointerId);
        if (event.pointerType === "touch") button.blur();
      });
      ["pointerup", "pointercancel", "lostpointercapture"].forEach((name) => button.addEventListener(name, () => keys.delete(direction)));
      button.addEventListener("contextmenu", (event) => event.preventDefault());
    });

    function updateFullscreenButton() {
      const active = document.fullscreenElement === page || document.webkitFullscreenElement === page || page.classList.contains("is-fullscreen");
      fullscreenButton.setAttribute("aria-label", active ? "Exit fullscreen" : "Enter fullscreen");
      fullscreenButton.title = active ? "Exit fullscreen" : "Enter fullscreen";
    }

    async function toggleFullscreen() {
      const nativeElement = document.fullscreenElement || document.webkitFullscreenElement;
      if (nativeElement === page) {
        if (document.exitFullscreen) await document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      } else if (page.classList.contains("is-fullscreen")) {
        page.classList.remove("is-fullscreen");
      } else {
        const requestFullscreen = page.requestFullscreen || page.webkitRequestFullscreen;
        if (requestFullscreen) {
          try {
            await requestFullscreen.call(page);
          } catch {
            page.classList.add("is-fullscreen");
          }
        } else {
          page.classList.add("is-fullscreen");
        }
      }
      updateFullscreenButton();
    }

    fullscreenButton.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("webkitfullscreenchange", updateFullscreenButton);

    reset();
    window.addEventListener("resize", resize);
    resize();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
